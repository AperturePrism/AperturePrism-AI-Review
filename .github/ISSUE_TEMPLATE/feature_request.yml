name: 功能建议
description: 提出新功能、增强现有能力或改进使用体验
title: "[feature] "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢建议。请先描述要解决的问题，再给出方案；提交前先搜索现有 Issue，避免重复。

  - type: textarea
    id: background
    attributes:
      label: 需求背景
      description: 你在什么场景下遇到了什么问题？现有能力为什么不够用？
      placeholder: 例如：在 NAS 上部署后无法直观看到当前任务被哪个模型处理，排查超时很费时。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 期望方案
      description: 你希望新增或改变什么？可以是交互、接口、配置项或分析行为
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 考虑过哪些其他做法？为什么它们不合适？
    validations:
      required: false

  - type: textarea
    id: acceptance
    attributes:
      label: 验收标准
      description: 满足哪些条件可以认为这个需求已完成？
      placeholder: |
        - 在 ... 页面可以看到 ...
        - 当 ... 时，接口返回 ...
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: 涉及模块
      options:
        - Web 控制台
        - API 服务
        - Issue 分析
        - PR 审查
        - 扫描 / 索引 / 向量检索
        - 仓库记忆 / Agent Skills
        - QQ 机器人
        - 部署与运维
        - 文档
        - 其他
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: 优先级建议
      description: 仅代表你的使用感受，最终优先级由维护者评估
      options:
        - P0：阻塞使用，需要尽快解决
        - P1：高，明显影响主要流程
        - P2：中，有明确收益
        - P3：低，锦上添花
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 参考实现、相关 Issue / PR、截图或外部资料链接
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: 提交前确认
      options:
        - label: 已搜索现有 Issue，确认没有重复
          required: true
        - label: 愿意在方案确认后提交 PR（可选）
          required: false
